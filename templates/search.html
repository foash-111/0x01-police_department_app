<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بحث عن شخص</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <style>
        /* Pop-up styles */
        .popup {
            display: none;
            position: fixed;
            z-index: 100;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .popup-content {
            background-color: #fff;
            margin: 15% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 50%;
        }

        .close {
            float: right;
            font-size: 1.5em;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 8px;
        }

        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
    <div class="search">
        <div class="search-container">
            <h1 class="search-grid-item">البحث عن شخص</h1>
            <form  id="searchForm">
                <div class="search-form">

                    <select class="search-grid-item" id="searchType" name="searchType">
                        <option value="name">البحث بالاسم</option>
                        <option value="entry">البحث برقم الإدراج</option>
                        <option value="charge">البحث برقم القضية وسنتها</option>
                    </select>
                
                    <!-- الحقول المختلفة -->
                    <div id="nameField" class="search-charge">
                        <input  type="text" id="searchInput" name="search_name" placeholder="ادخل الاسم">
                    </div>
                
                    <div id="entryField" class="search-charge hidden">
                        <input  type="text" id="searchEntry" name="search_entry" placeholder="ادخل رقم الإدراج">
                    </div>
                
                    <div id="chargeField" class="search-charge search-grid-item hidden">
                        <input  type="text" id="searchChargeYear" name="search_charge_year" placeholder="ادخل سنة القضية">
                        <input  type="text" id="searchChargeNumber" name="search_charge_number" placeholder="ادخل رقم القضية">
                    </div>
                
                </div>
                <!-- القائمة المنسدلة -->
                <!-- زر البحث -->
                <button class="search-grid-item" type="submit">بحث</button>
            </form>

            <div id="searchResultsPopup" class="popup">
                <div class="popup-content">
                    <span class="close">&times;</span>
                    <h2>نتائج البحث</h2>
                    <table id="resultsTable">
                        <thead>
                            <tr>
                                <th>رقم الادراج</th>
                                <th>العنوان</th>
                                <th>الاسم</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- نتائج البحث هتتحط هنا -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        <button onclick="window.location.href='/dashboard'" class="back-search-button">رجوع</button>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
         const searchType = document.getElementById('searchType');
    const nameField = document.getElementById('nameField');
    const entryField = document.getElementById('entryField');
    const chargeField = document.getElementById('chargeField');

    searchType.addEventListener('change', () => {
         // مسح القيم
         searchInput.value = "";
        searchEntry.value = "";
        searchChargeNumber.value = "";
        searchChargeYear.value = "";

        // إخفاء جميع الحقول أولاً
        nameField.classList.add('hidden');
        entryField.classList.add('hidden');
        chargeField.classList.add('hidden');

        // عرض الحقل المناسب حسب الاختيار
        if (searchType.value === 'name') {
            nameField.classList.remove('hidden');
        } else if (searchType.value === 'entry') {
            entryField.classList.remove('hidden');
        } else if (searchType.value === 'charge') {
            chargeField.classList.remove('hidden');
        }
    });
        // Function to handle search form submission
        $('#searchForm').on('submit', function(event) {
            event.preventDefault();
            
            const search_name = $('#searchInput').val();
            const search_entry = $('#searchEntry').val();
            const search_charge_number = $('#searchChargeNumber').val();
            const search_charge_year = $('#searchChargeYear').val();

            $.ajax({
                type: 'POST',
                url: '/search_person',
                data: { 
                    search_name: search_name,
                    search_entry: search_entry,
                    search_charge_number: search_charge_number,
                    search_charge_year: search_charge_year,
                    
                },
                success: function(response) {
                    // Clear old results
                    $('#resultsTable tbody').empty();

                    if (response.length > 0) {
                        // Populate the table with search results
                        response.forEach(function(person) {
                            const address = person.residence ? person.residence : 'لا يوجد';
                            const caseNumber = person.entry_number ? person.entry_number : 'لا يوجد';
                            $('#resultsTable tbody').append(`
                                <tr>
                                    <td>${caseNumber}</td>
                                    <td>${address}</td>
                                    <td><a href="/profile/${person.id}">${person.name}</a></td>
                                </tr>
                            `);
                        });
                    } else {
                        // If no results, show message
                        $('#resultsTable tbody').append('<tr><td colspan="3">لم يتم العثور على نتائج.</td></tr>');
                    }

                    // Show the pop-up
                    $('#searchResultsPopup').css('display', 'block');
                },
                error: function(error) {
                    console.log('Error:', error);
                    $('#resultsTable tbody').append('<tr><td colspan="3">حدث خطأ أثناء البحث.</td></tr>');
                    $('#searchResultsPopup').css('display', 'block');
                }
            });
        });

        // Close the pop-up when clicking on the close button
        $('.close').on('click', function() {
            $('#searchResultsPopup').css('display', 'none');
        });

        // Close the pop-up when clicking outside the pop-up content
        $(window).on('click', function(event) {
            if (event.target.id === 'searchResultsPopup') {
                $('#searchResultsPopup').css('display', 'none');
            }
        });
    </script>
</body>
</html>
