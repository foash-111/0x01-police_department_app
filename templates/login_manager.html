<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <div class="form-container">
        
        <h1>تسجيل الدخول</h1>
        <form id="loginForm" method="POST">
            
            <label for="username">اسم المستخدم</label>
            <input type="text" id="username" name="username" required>

            <label for="password">كلمة المرور</label>
            <input type="password" id="password" name="password" required>

            {% if error %}
            <div id="errorLogin" style="display:block;">
            {{ error }}
            </div>
            {% else %}
            <div id="errorLogin" style="display:none;">
                {{ error }}
                </div>
        {% endif %}
            <button type="submit">تسجيل الدخول</button>
        </form>
    </div>
    <script src="/static/js/script.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        // Check if there is an error message and set a timeout to hide it
        const errorDiv = document.getElementById('errorLogin');
        if (errorDiv.style.display === 'block') {
            setTimeout(() => {
                errorDiv.style.display = 'none'; // Hide the error message after 5 seconds
            }, 5000); // 5000 milliseconds = 5 seconds
        }
    </script>

</body>
</html>
